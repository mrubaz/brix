name: Feature request
description: Something you would like a brix package to do.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - brix_cli
        - brix_ui
        - brix_getx
        - brix_network
        - brix_storage
        - brix
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work. A small code sample is welcome.
