# Checks every push and pull request: format, analyze, tests for both
# packages. `main` only accepts a pull request when both jobs pass.
name: CI

on:
  push:
    branches: [main, dev-rubaz]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  brix:
    name: brix (pure Dart)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/brix
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/main.dart

  brix_network:
    name: brix_network (REST)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/brix_network
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
      - run: dart analyze --fatal-infos
      - run: dart test

  brix_storage:
    name: brix_storage (storage)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/brix_storage
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
      - run: flutter analyze --fatal-infos
      - run: flutter test

  brix_ui:
    name: brix_ui (widgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/brix_ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Example app
        working-directory: packages/brix_ui/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  brix_cli:
    name: brix_cli (create)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/brix_cli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bin templates/app/lib templates/app/test
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Template app
        working-directory: packages/brix_cli/templates/app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: A new app from brix create
        run: |
          dart run bin/brix.dart create ci_app
          cd ci_app
          # Test against the packages in this repo, so a change that is not
          # on pub.dev yet is checked too.
          cat > pubspec_overrides.yaml <<YAML
          dependency_overrides:
            brix: {path: ../../brix}
            brix_getx: {path: ../../brix_getx}
            brix_network: {path: ../../brix_network}
            brix_storage: {path: ../../brix_storage}
            brix_ui: {path: ../../brix_ui}
          YAML
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Release builds hold no local test backend
        working-directory: packages/brix_cli/ci_app
        run: |
          flutter build web --release --dart-define=API_URL=https://api.example.com/v1/
          flutter build apk --release --target-platform android-arm64 --dart-define=API_URL=https://api.example.com/v1/
          unzip -o -q build/app/outputs/flutter-apk/app-release.apk -d build/apk
          for secret in 'demo@brix.dev' 'Demo@1234' 'Reset local backend' 'Skip login' 'Test backend'; do
            if grep -rqa "$secret" build/web build/apk; then
              echo "Found '$secret' in a release build"; exit 1
            fi
          done
          # The check must see real app text, or it proves nothing.
          grep -rqa 'Forgot password?' build/web
          grep -rqa 'Forgot password?' build/apk

  brix_getx:
    name: brix_getx (GetX)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/brix_getx
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Example app
        working-directory: packages/brix_getx/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
