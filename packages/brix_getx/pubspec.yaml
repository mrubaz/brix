name: brix_getx
description: "GetX controllers for every brix account screen: login, signup, email code, reset, profile and delete account, with fields, form key and loading state."
version: 1.0.4
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_getx
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - getx
  - authentication
  - login
  - otp
  - state-management

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.0.1
  flutter:
    sdk: flutter
  get: ^4.7.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Splash, login and signup on brix_getx controllers."
    path: doc/screenshots/app_1_start.png
  - description: "Email code, forgot password and reset password on brix_getx controllers."
    path: doc/screenshots/app_2_code_password.png
