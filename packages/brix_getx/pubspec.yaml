name: brix_getx
description: GetX controllers for brix – login, signup, email code, password reset, profile and account screens with text fields, form key and loading state ready.
version: 1.0.2
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_getx
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - getx
  - authentication
  - login
  - otp
  - state-management

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.0.1
  flutter:
    sdk: flutter
  get: ^4.7.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Login screen of the example app on BrixLoginController."
    path: doc/screenshots/login.png
  - description: "Signup with the live password checklist (PasswordRulesTracker)."
    path: doc/screenshots/signup_password_rules.png
  - description: "Email code boxes with resend countdown (BrixOtpController)."
    path: doc/screenshots/code_boxes.png
