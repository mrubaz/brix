name: brix_app
description: "A Flutter app made with brix. Login, signup, email code, password reset, profile and logout are ready."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.3.1
  brix_getx: ^1.0.2
  brix_network: ^1.2.1
  brix_storage: ^1.0.0
  brix_ui: ^1.1.0
  flutter:
    sdk: flutter
  get: ^4.7.3
  go_router: ^17.3.0
  path_provider: ^2.1.5
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
