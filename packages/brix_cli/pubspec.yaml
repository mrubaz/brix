name: brix_cli
description: "Start here: brix create makes a Flutter app that runs at once, with login, signup, codes, reset, theme, API calls and safe storage on every brix package."
version: 2.0.0
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_cli
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - cli
  - scaffolding
  - template
  - authentication

environment:
  sdk: ^3.13.0

executables:
  brix: brix

dependencies:
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

screenshots:
  - description: "Splash, login and signup in a new app."
    path: doc/screenshots/app_1_start.png
  - description: "Email code, forgot password and reset password in a new app."
    path: doc/screenshots/app_2_code_password.png
  - description: "Home with the setup steps, the widget library and settings."
    path: doc/screenshots/app_3_tabs.png
  - description: "Profile, change password and delete account."
    path: doc/screenshots/app_4_account.png
  - description: "Appearance and about."
    path: doc/screenshots/app_5_appearance_about.png
  - description: "brix create asks for the state library."
    path: doc/screenshots/terminal.png
  - description: "The folders of a new app."
    path: doc/screenshots/folders.png
