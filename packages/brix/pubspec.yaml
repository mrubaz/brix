name: brix
description: "The core of the brix Flutter family: login, signup, email code, reset, profile and account logic in pure Dart. Any backend, any state library."
version: 1.3.1
repository: https://github.com/mrubaz/brix/tree/main/packages/brix
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - authentication
  - login
  - otp
  - architecture
  - state-management

environment:
  sdk: ^3.13.0

dependencies:
  meta: ^1.19.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^6.0.0
  test: ^1.26.0

screenshots:
  - description: "BrixLogger: one readable box per message, a colour per level."
    path: doc/screenshots/console.png
