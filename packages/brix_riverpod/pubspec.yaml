name: brix_riverpod
description: "Riverpod notifiers for every brix account screen: login, signup, email code, reset, profile and delete account, with immutable states and no Flutter objects inside."
version: 2.0.0
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_riverpod
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - riverpod
  - authentication
  - login
  - otp
  - state-management

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.3.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Splash, login and signup on brix_riverpod notifiers."
    path: doc/screenshots/app_1_start.png
  - description: "Email code, forgot password and reset password on brix_riverpod notifiers."
    path: doc/screenshots/app_2_code_password.png
