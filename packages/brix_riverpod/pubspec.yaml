name: brix_riverpod
description: "Riverpod notifiers for every brix account screen: login, signup, email code, reset, profile and delete account, with fields, form key and loading state."
version: 1.0.0
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_riverpod
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - riverpod
  - authentication
  - login
  - otp
  - state-management

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Login, signup with live password rules and the email code, each screen on a brix_riverpod notifier."
    path: doc/screenshots/app_sign_in.png
  - description: "Forgot password, code and new password, and home with logout on brix_riverpod notifiers."
    path: doc/screenshots/app_reset.png
