name: brix_riverpod_example
description: Login, signup, code check and password reset on brix + Riverpod, with an in-memory demo backend.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.3.2
  brix_riverpod:
    path: ../
  brix_ui: ^1.2.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
