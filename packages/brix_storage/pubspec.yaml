name: brix_storage
description: "Safe local storage for Flutter apps: values and secrets with reinstall and broken-keystore handling, plus a ready-made brix session store."
version: 1.0.0
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_storage
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - storage
  - secure-storage
  - shared-preferences
  - authentication

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  brix: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Values in shared_preferences, secrets in Keychain / Keystore."
    path: doc/screenshots/storage.png
