name: brix_bloc
description: "Cubits for every brix account screen: login, signup, email code, reset, profile and delete account, with immutable states and no Flutter code inside."
version: 1.0.0
repository: https://github.com/mrubaz/brix/tree/main/packages/brix_bloc
issue_tracker: https://github.com/mrubaz/brix/issues
topics:
  - bloc
  - authentication
  - login
  - otp
  - state-management

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  bloc: ^9.2.1
  brix: ^1.3.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: "Splash, login and signup on brix_bloc cubits."
    path: doc/screenshots/app_1_start.png
  - description: "Email code, forgot password and reset password on brix_bloc cubits."
    path: doc/screenshots/app_2_code_password.png
